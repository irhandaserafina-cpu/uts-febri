services:
  - type: web
    name: uts-bi-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn uts_bi:app --workers 1 --threads 4 --timeout 300
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USER
        value: febriana
      - key: APP_PASSWORD
        sync: false   # diisi manual di dashboard Render (jangan ditulis di GitHub)
